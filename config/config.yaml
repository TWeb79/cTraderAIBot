# Core strategy/runtime configuration. Secrets (API keys, account id/login,
# demo flag) live in .env, not here — see .env.example.

symbol: "US500"

timeframes:
  signal: "M5"        # bar timeframe the strategy runs on
  profile: "M1"        # finer timeframe used to build the intraday volume profile
  htf: "H1"             # higher timeframe used for regime confirmation

session:
  # NY session open window (UTC). Adjust for DST — US Eastern open is
  # 13:30 UTC (EDT, Mar-Nov) / 14:30 UTC (EST, Nov-Mar).
  ny_open_utc: "13:30"
  gap_fill_window_minutes: 60

volume_profile:
  value_area_pct: 0.70
  price_bin_ticks: 5      # number of price ticks per histogram bin

regime:
  adx_period: 14
  adx_trend_threshold: 25
  adx_range_threshold: 20
  di_separation_min: 5
  trend_confirm_bars: 6        # bars ADX/DI must stay aligned to promote BREAKOUT -> TREND
  atr_period: 14
  atr_expansion_factor: 1.3    # ATR vs rolling median ATR to flag expansion (breakout trigger)
  atr_median_lookback: 50

signals:
  level_proximity_atr_mult: 0.25   # how close price must be to a level (in ATR) to react to it
  breakout_confirm_atr_mult: 0.15  # close-beyond-level buffer to count as a real breakout

risk:
  risk_per_trade_pct: 1.5
  max_daily_loss_pct: 5.0
  max_open_risk_pct: 10.0
  min_stop_atr_mult: 0.5   # stop distance floor, in ATR, to avoid unrealistically tight stops

backtest:
  spread_points: 0.4        # static spread assumption if historical spread isn't available
  commission_per_lot: 0.0
  initial_equity: 10000

execution:
  poll_interval_seconds: 15
  dry_run_default: true
  bars_for_context: 100

training:
  registry_path: "data/reports/parameter_registry.json"
  feedback_weight: 2.0          # live trades count Nx in scoring
  auto_retrain_after_trades: 20 # trigger retrain after N new live trades (0 = disabled)
  min_improvement_pct: 5.0      # only accept new params if score improves by this %
